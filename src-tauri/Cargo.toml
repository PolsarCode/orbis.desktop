[package]
name = "orbis"
version = "0.1.0"
description = "The Orbis desktop app"
authors = ["PolsarCode"]
repository = "https://github.com/PolsarCode/orbis.desktop"
edition = "2024"
rust-version = "1.90"

[lib]
name = "orbis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
